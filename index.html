<!doctype html>
<!--
  index.html — точка входа Telegram Mini App «Нишевед».
  Здесь только каркас: заставка (#splash) и контейнер экранов (#app).
  Экраны рисуются из js/screens/*.js. Порядок подключения скриптов важен:
  SDK Telegram → config → data → telegram → store → report → ui → router → screens → app.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Запрет зума и подгонка под вырезы экрана — чтобы выглядело как приложение -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light dark">
  <title>Нишевед</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232AABEE'/%3E%3Ccircle cx='28' cy='28' r='13' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='M38 38l11 11' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Telegram Web App SDK: данные пользователя, тема, MainButton, BackButton, CloudStorage -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Заставка: видна, пока грузятся данные (убирается в app.js) -->
  <div id="splash" aria-hidden="true">
    <div class="splash-logo">
      <svg viewBox="0 0 64 64" width="72" height="72"><rect width="64" height="64" rx="18" fill="#2AABEE"/><circle cx="28" cy="28" r="13" fill="none" stroke="#fff" stroke-width="6"/><path d="M38 38l11 11" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>
    </div>
    <div class="splash-name">Нишевед</div>
    <div class="splash-bar"><i></i></div>
  </div>

  <!-- Сюда роутер вставляет экраны -->
  <main id="app"></main>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/store.js"></script>
  <script src="js/report.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/screens/_common.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/niche.js"></script>
  <script src="js/screens/about.js"></script>
  <script src="js/screens/goal.js"></script>
  <script src="js/screens/company.js"></script>
  <script src="js/screens/history.js"></script>
  <script src="js/screens/confirm.js"></script>
  <script src="js/screens/generating.js"></script>
  <script src="js/screens/report.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/payment.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
